<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>

  <body>
    <table>
      <thead>
        <tr>
          <th>S.No</th>
          <th>Name</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>alex</td>
        </tr>

        <tr>
          <td>2</td>
          <td>alina</td>
        </tr>
      </tbody>
    </table>

    <p style="color: orange">Lorem, ipsum.</p>
  </body>
</html>
